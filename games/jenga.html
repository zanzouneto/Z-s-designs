<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6YZQRLN0R4"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-6YZQRLN0R4');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d0221">
    <title>Jenga Dares · Play online by ZS</title>
    <meta name="description" content="Jenga dares party game in English and Arabic: number your blocks and get a dare for each one.">
    <link rel="icon" href="/assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&family=Lalezar&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/games/shared/games.css">
    <script src="/games/shared/core.js"></script>
    <style>
        .display { font: 700 54px/1 var(--display); text-align: center; padding: 14px; border-radius: 14px; background: rgba(0,0,0,.25); border: 1px solid rgba(5,217,232,.4); color: var(--cyan); min-height: 82px; direction: ltr; }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; direction: ltr; }
        .keypad button { min-height: 60px; border-radius: 14px; border: 1px solid rgba(185,167,214,.35); background: rgba(255,255,255,.06); font: 700 24px/1 var(--body); cursor: pointer; touch-action: manipulation; }
        .keypad button:active { background: rgba(255,42,109,.25); }
        #dare { font-size: clamp(20px, 5vw, 26px); font-weight: 700; line-height: 1.4; min-height: 3em; margin-top: 10px; }
    </style>
</head>
<body>
    <header class="zs-top">
        <a class="zs-back" href="/games" data-i18n="back">Games</a>
        <h1 class="zs-title" data-i18n="jenga_title">Jenga Dares</h1>
        <button class="zs-lang" id="zs-lang" type="button">عربي</button>
    </header>
    <main class="zs-main">
        <section class="screen" id="setup">
            <div class="card">
                <p data-i18n="jenga_help"></p>
                <h3 data-i18n="jenga_categories">Categories</h3>
                <div class="chips" id="cats"></div>
                <button class="btn btn-primary btn-lg btn-block" style="margin-top:22px" id="start" type="button" data-i18n="start">Start</button>
            </div>
        </section>
        <section class="screen" id="game" hidden>
            <div class="card play" id="dare-card" hidden>
                <span class="badge" id="dare-block"></span> <span class="badge" id="dare-cat"></span>
                <p id="dare" aria-live="polite"></p>
            </div>
            <div class="card">
                <h3 style="margin-top:0" data-i18n="jenga_enter">Block number</h3>
                <div class="display" id="num">–</div>
                <div class="keypad" id="keypad">
                    <button type="button">1</button><button type="button">2</button><button type="button">3</button>
                    <button type="button">4</button><button type="button">5</button><button type="button">6</button>
                    <button type="button">7</button><button type="button">8</button><button type="button">9</button>
                    <button type="button" data-k="C">C</button><button type="button">0</button><button type="button" data-k="del" aria-label="Delete">⌫</button>
                </div>
                <button class="btn btn-primary btn-lg btn-block" id="get" type="button" data-i18n="jenga_get">Get dare</button>
            </div>
            <div class="row"><button class="btn btn-ghost" id="settings" type="button" data-i18n="settings">Settings</button></div>
        </section>
    </main>
    <script src="/games/jenga.js"></script>
</body>
</html>
