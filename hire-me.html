<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hire me · Zeina Saade</title>
    <meta name="description" content="Get in touch with Zeina Saade for graphic design, web design and Webflow projects. Email me or book a consultation.">
    <link rel="icon" href="/assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="/site.css">
    <link rel="stylesheet" href="/hire-me.css">
</head>
<body>
    <nav-menu></nav-menu>
    <main class="zs-wrap hm">
        <section class="hm-hero">
            <div class="hm-hero-text">
                <span class="hm-badge"><span class="dot" aria-hidden="true"></span>I’m available for projects</span>
                <h1 class="zs-display">Let’s build awesomeness together</h1>
                <p class="zs-lead">Graphic design, web design and Webflow builds. Send me a message or book a free call, whichever is easier.</p>
            </div>
            <img class="hm-wave" src="/assets/hire%20me.png" alt="Zeina waving hello" width="260" height="271">
        </section>

        <section class="hm-panel">
            <div class="hm-tabs" role="tablist" aria-label="How to reach me">
                <button class="hm-tab" type="button" role="tab" id="tab-email" aria-controls="panel-email" aria-selected="true">Email me</button>
                <button class="hm-tab" type="button" role="tab" id="tab-call" aria-controls="panel-call" aria-selected="false" tabindex="-1">Book a consult</button>
            </div>

            <div class="hm-card" id="panel-email" role="tabpanel" aria-labelledby="tab-email">
                <form action="https://formspree.io/f/xleyzdvq" method="POST" class="hm-form">
                    <h2 class="zs-h2">Tell me things</h2>
                    <label>
                        <span>Your email</span>
                        <input type="email" name="email" required autocomplete="email" placeholder="you@example.com">
                    </label>
                    <label>
                        <span>Subject</span>
                        <input type="text" name="Subject" placeholder="A new website, a logo, …">
                    </label>
                    <label>
                        <span>Message</span>
                        <textarea name="message" rows="6" required placeholder="What are you working on?"></textarea>
                    </label>
                    <button class="zs-btn zs-btn-lg zs-btn-ink" type="submit">Send</button>
                </form>
            </div>

            <div class="hm-card is-call" id="panel-call" role="tabpanel" aria-labelledby="tab-call" hidden>
                <!-- Calendly inline widget begin -->
                <div class="calendly-inline-widget" data-url="https://calendly.com/zeina-saade/consultation?background_color=15222c&amp;text_color=f3f0e8&amp;primary_color=ffcc00" style="min-width:300px;height:700px;"></div>
                <script src="https://assets.calendly.com/assets/external/widget.js" async></script>
                <!-- Calendly inline widget end -->
            </div>
        </section>
    </main>
    <main-footer></main-footer>
    <script src="/navigation.js"></script>
    <script src="/hire-me.js"></script>
</body>
</html>
